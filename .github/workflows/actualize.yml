name: Actualize enterprise solutions

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

# Avoid overlapping actualization workflows.
concurrency:
  group: enterprise-solution-actualization
  cancel-in-progress: false

jobs:
  actualize:
    name: Actualize and retrieve topology
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Provides a stable OIDC subject for the Azure federated credential.
    # environment: institutive

    env:
      HCP_STACK_ID: ${{ vars.SOLUTION_ACTUALIZATION_STACK_ID }}
      HCP_TOKEN_SECRET_ID: ${{ vars.AMIASEA_TFE_TOKEN_VERSIONLESS_ID }}
      GITHUB_EVENT_AFTER: ${{ github.event.after }}

    steps:
      - name: Install Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest
          terraform_wrapper: false

      - name: Authenticate to Azure using OIDC
        uses: azure/login@v3.1.0
        with:
          client-id: ${{ vars.AZURE_INSTITUTIVE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_INSTITUTIVE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_INSTITUTIVE_SUBSCRIPTION_ID }}

      - name: Retrieve HCP Terraform token from Key Vault
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:HCP_TOKEN_SECRET_ID) {
            throw "AMIASEA_TFE_TOKEN_VERSIONLESS_ID is not configured."
          }

          $token = az keyvault secret show `
            --id $env:HCP_TOKEN_SECRET_ID `
            --query value `
            --output tsv

          if ($LASTEXITCODE -ne 0 -or -not $token) {
            throw "Failed to retrieve the HCP Terraform token from Key Vault."
          }

          Write-Output "::add-mask::$token"

          "HCP_TOKEN=$token" >> $env:GITHUB_ENV
          "TF_TOKEN_app_terraform_io=$token" >> $env:GITHUB_ENV

      - name: Inspect Stack configuration and wait for deployment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:HCP_STACK_ID) {
            throw "SOLUTION_ACTUALIZATION_STACK_ID is not configured."
          }

          if (-not $env:HCP_TOKEN) {
            throw "Failed to retrieve the HCP Terraform token."
          }

          function Invoke-TerraformJson {
            param(
              [Parameter(Mandatory)]
              [string[]]$Arguments
            )

            Write-Host "terraform stacks $($Arguments -join ' ')"

            $output = & terraform stacks @Arguments
            $exitCode = $LASTEXITCODE

            if ($exitCode -ne 0) {
              throw "Terraform Stacks CLI failed with exit code $exitCode."
            }

            $json = ($output | Out-String).Trim()

            if (-not $json) {
              throw "Terraform Stacks CLI returned empty JSON output."
            }

            return ($json | ConvertFrom-Json -Depth 100)
          }

          $tag = $env:GITHUB_REF_NAME
          $ref = $env:GITHUB_REF
          $refType = $env:GITHUB_REF_TYPE
          $commit = $env:GITHUB_SHA
          $eventAfter = $env:GITHUB_EVENT_AFTER

          Write-Host ""
          Write-Host "GitHub event:"
          Write-Host "  Ref:         $ref"
          Write-Host "  Ref type:    $refType"
          Write-Host "  Tag:         $tag"
          Write-Host "  GitHub SHA:  $commit"
          Write-Host "  Event after: $eventAfter"

          if ($refType -ne "tag") {
            throw "Expected a tag event; received ref type '$refType'."
          }

          if ($eventAfter -and $eventAfter -ne $commit) {
            throw "GitHub SHA '$commit' does not match event.after '$eventAfter'."
          }

                    # Discover the Stack configuration for this exact GitHub commit.
          # HCP may take time to register and prepare a new configuration.

          $configurationDeadline = [DateTimeOffset]::UtcNow.AddMinutes(10)
          $configuration = $null

          while ([DateTimeOffset]::UtcNow -lt $configurationDeadline) {
            $configurationList = Invoke-TerraformJson @(
              "configuration",
              "list",
              "-stack-id",
              $env:HCP_STACK_ID,
              "-json"
            )

            $configurations = @($configurationList.configurations)

            Write-Host ""
            Write-Host "Inspecting $($configurations.Count) Stack configurations."

            $matchingConfigurations = @()

            foreach ($item in $configurations) {
              $detail = Invoke-TerraformJson @(
                "configuration",
                "show",
                "-configuration-id",
                $item.id,
                "-json"
              )

              $ingress = $detail.ingress_attributes

              Write-Host ""
              Write-Host "Configuration: $($item.id)"
              Write-Host "  Sequence:       $($detail.configuration.sequence_number)"
              Write-Host "  Status:         $($detail.configuration.status)"
              Write-Host "  Commit SHA:     $($ingress.commit_sha)"
              Write-Host "  Commit message: $($ingress.commit_message)"
              Write-Host "  Branch:         '$($ingress.branch)'"
              Write-Host "  Default branch: $($ingress.on_default_branch)"
              Write-Host "  Pull request:   $($ingress.is_pull_request)"

              if ($ingress.commit_sha -eq $commit) {
                $matchingConfigurations += [PSCustomObject]@{
                  Id     = $item.id
                  Detail = $detail
                }
              }
            }

            if ($matchingConfigurations.Count -gt 0) {
              # If multiple configurations match, use the highest sequence.
              $configuration = $matchingConfigurations |
                Sort-Object { [int]$_.Detail.configuration.sequence_number } -Descending |
                Select-Object -First 1

              break
            }

            Write-Host "No configuration matches commit '$commit' yet."
            Start-Sleep -Seconds 10
          }

          if (-not $configuration) {
            throw "No Stack configuration appeared for tag '$tag' and commit '$commit' within 10 minutes."
          }

          $configurationId = $configuration.Id

          Write-Host ""
          Write-Host "Matched Stack configuration:"
          Write-Host "  ID:       $configurationId"
          Write-Host "  Sequence: $($configuration.Detail.configuration.sequence_number)"
          Write-Host "  Status:   $($configuration.Detail.configuration.status)"

          # Wait for HCP to finish preparing this configuration.
          while ([DateTimeOffset]::UtcNow -lt $configurationDeadline) {
            $detail = Invoke-TerraformJson @(
              "configuration",
              "show",
              "-configuration-id",
              $configurationId,
              "-json"
            )

            $configurationStatus = $detail.configuration.status

            Write-Host "Configuration '$configurationId': $configurationStatus"

            if ($configurationStatus -eq "completed") {
              $configuration.Detail = $detail
              break
            }

            if ($configurationStatus -in @(
              "errored",
              "failed",
              "canceled",
              "cancelled"
            )) {
              throw "Configuration '$configurationId' preparation failed with status '$configurationStatus'."
            }

            Start-Sleep -Seconds 10
          }

          if ($configuration.Detail.configuration.status -ne "completed") {
            throw "Timed out after 10 minutes waiting for configuration '$configurationId' to finish preparing."
          }

          Write-Host "Configuration preparation completed."

          # List deployment groups belonging to the matched configuration.
          $groupResponse = Invoke-TerraformJson @(
            "deployment-group",
            "list",
            "-configuration-id",
            $configurationId,
            "-json"
          )

          $deploymentGroup = @($groupResponse.deployment_groups) |
            Where-Object { $_.name -eq "solutions_default" } |
            Select-Object -First 1

          if (-not $deploymentGroup) {
            throw "No solutions_default deployment group exists for configuration '$configurationId'."
          }

          $deploymentGroupId = $deploymentGroup.id

          Write-Host ""
          Write-Host "Deployment group:"
          Write-Host "  ID:     $deploymentGroupId"
          Write-Host "  Name:   $($deploymentGroup.name)"
          Write-Host "  Status: $($deploymentGroup.status)"

          # List deployment runs associated with this deployment group.
          $runResponse = Invoke-TerraformJson @(
            "deployment-run",
            "list",
            "-deployment-group-id",
            $deploymentGroupId,
            "-json"
          )

          $deploymentRun = @($runResponse.deployment_runs) |
            Sort-Object { [DateTimeOffset]::Parse($_.created_at) } -Descending |
            Select-Object -First 1

          if (-not $deploymentRun) {
            throw "No deployment run exists for deployment group '$deploymentGroupId'."
          }

          $deploymentRunId = $deploymentRun.id

          Write-Host ""
          Write-Host "Deployment run:"
          Write-Host "  ID:     $deploymentRunId"
          Write-Host "  Status: $($deploymentRun.status)"

          # Wait up to 10 minutes for the deployment run to succeed.
          # Pending operator approval is not automatically approved.
          $deploymentDeadline = [DateTimeOffset]::UtcNow.AddMinutes(10)

          $failureStatuses = @(
            "failed",
            "errored",
            "abandoned",
            "canceled",
            "cancelled"
          )

          while ($true) {
            if ([DateTimeOffset]::UtcNow -ge $deploymentDeadline) {
              throw "Timed out after 10 minutes waiting for deployment run '$deploymentRunId'. Last status: '$($deploymentRun.status)'."
            }

            $runResponse = Invoke-TerraformJson @(
              "deployment-run",
              "list",
              "-deployment-group-id",
              $deploymentGroupId,
              "-json"
            )

            $currentRun = @($runResponse.deployment_runs) |
              Where-Object { $_.id -eq $deploymentRunId } |
              Select-Object -First 1

            if (-not $currentRun) {
              throw "Deployment run '$deploymentRunId' disappeared from its deployment group."
            }

            $status = $currentRun.status

            Write-Host "Deployment run '$deploymentRunId': $status"

            if ($status -eq "succeeded") {
              break
            }

            if ($status -in $failureStatuses) {
              throw "Stack deployment ended with status '$status'."
            }

            Start-Sleep -Seconds 15
          }

          Write-Host ""
          Write-Host "Stack deployment succeeded."

          # Retrieve the Stack's latest aggregated output summary.
          # The Stacks CLI does not currently expose this output summary.
          $api = "https://app.terraform.io/api/v2"

          $headers = @{
            Authorization = "Bearer $env:HCP_TOKEN"
            Accept        = "application/vnd.api+json"
          }

          $outputPath = Join-Path $env:GITHUB_WORKSPACE "solution-variety-topologies.json"

          Invoke-WebRequest `
            -Uri "$api/stacks/$env:HCP_STACK_ID/latest-output-summary" `
            -Headers $headers `
            -OutFile $outputPath

          if (-not (Test-Path $outputPath) -or (Get-Item $outputPath).Length -eq 0) {
            throw "The Stack output summary was empty or was not created."
          }

          $outputs = Get-Content $outputPath -Raw | ConvertFrom-Json -Depth 100

          Write-Host ""
          Write-Host "Retrieved Stack output summary:"
          $outputs | ConvertTo-Json -Depth 100 | Write-Host

          "stack_tag=$tag" >> $env:GITHUB_OUTPUT
          "commit_sha=$commit" >> $env:GITHUB_OUTPUT
          "configuration_id=$configurationId" >> $env:GITHUB_OUTPUT
          "deployment_group_id=$deploymentGroupId" >> $env:GITHUB_OUTPUT
          "deployment_run_id=$deploymentRunId" >> $env:GITHUB_OUTPUT

      - name: Upload Stack output summary
        uses: actions/upload-artifact@v7.0.2
        with:
          name: solution-variety-topologies
          path: solution-variety-topologies.json
          if-no-files-found: error
          retention-days: 7
  
  prepare-attestations:
    name: Prepare variety attestations
    runs-on: ubuntu-latest
    needs: actualize
    timeout-minutes: 5

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Download Stack output summary
        uses: actions/download-artifact@v8.0.2
        with:
          name: solution-variety-topologies
          path: topology

      - name: Generate attestation matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail

          artifact="topology/solution-variety-topologies.json"

          if [[ ! -f "$artifact" ]]; then
            echo "Stack topology artifact was not found."
            exit 1
          fi

          matrix=$(jq -c '
            [
              .published_outputs.solution_variety_topologies.value
              | to_entries[]
              | .key as $solution
              | .value.varieties
              | to_entries[]
              | {
                  solution_name: $solution,
                  variety_name: .key,
                  subject_name: ("amiasea-" + $solution + "-" + .key)
                }
            ]
          ' "$artifact")

          if [[ "$matrix" == "[]" ]]; then
            echo "No solution varieties were found."
            exit 1
          fi

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

          echo "Prepared $(jq 'length' <<< "$matrix") variety attestations."

  attest:
    name: Attest ${{ matrix.subject_name }}
    runs-on: ubuntu-latest
    needs:
      - actualize
      - prepare-attestations
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare-attestations.outputs.matrix) }}

    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Download Stack output summary
        uses: actions/download-artifact@v8.0.2
        with:
          name: solution-variety-topologies
          path: topology

      - name: Generate variety predicate
        id: predicate
        shell: pwsh
        env:
          SOLUTION_NAME: ${{ matrix.solution_name }}
          VARIETY_NAME: ${{ matrix.variety_name }}
          SUBJECT_NAME: ${{ matrix.subject_name }}
        run: |
          $ErrorActionPreference = "Stop"

          $artifactPath = Join-Path $env:GITHUB_WORKSPACE "topology/solution-variety-topologies.json"
          $outputPath = Join-Path $env:GITHUB_WORKSPACE "attestations"

          if (-not (Test-Path $artifactPath)) {
            throw "Stack topology artifact was not found."
          }

          $summary = Get-Content $artifactPath -Raw | ConvertFrom-Json -Depth 100
          $solutions = $summary.published_outputs.solution_variety_topologies.value

          $solution = $solutions.PSObject.Properties[$env:SOLUTION_NAME].Value

          if (-not $solution) {
            throw "Solution '$env:SOLUTION_NAME' was not found."
          }

          $variety = $solution.varieties.PSObject.Properties[$env:VARIETY_NAME].Value

          if (-not $variety) {
            throw "Variety '$env:VARIETY_NAME' was not found in solution '$env:SOLUTION_NAME'."
          }

          New-Item -ItemType Directory -Path $outputPath -Force | Out-Null

          $subjectBytes = [System.Text.Encoding]::UTF8.GetBytes($env:SUBJECT_NAME)
          $subjectHash = [System.Security.Cryptography.SHA256]::HashData($subjectBytes)
          $subjectDigest = "sha256:$([Convert]::ToHexString($subjectHash).ToLowerInvariant())"

          $predicate = [ordered]@{
            definition = [ordered]@{
              organization = "amiasea"
              solution = $env:SOLUTION_NAME
              variety = $env:VARIETY_NAME
              release = $solution.definition_release
            }

            topology = $variety

            provenance = [ordered]@{
              repository = $env:GITHUB_REPOSITORY
              workflow = $env:GITHUB_WORKFLOW_REF
              workflow_run_id = $env:GITHUB_RUN_ID
              workflow_run_attempt = $env:GITHUB_RUN_ATTEMPT
              commit = $env:GITHUB_SHA
              tag = $env:GITHUB_REF_NAME
              stack_id = "st-gzVxTc6CDzmGvN3J"
            }
          }

          $predicatePath = Join-Path $outputPath "predicate.json"

          $predicate |
            ConvertTo-Json -Depth 100 |
            Set-Content -Path $predicatePath -Encoding utf8

          "subject_digest=$subjectDigest" >> $env:GITHUB_OUTPUT
          "predicate_path=$predicatePath" >> $env:GITHUB_OUTPUT

          Write-Host "Prepared predicate for $env:SUBJECT_NAME."

      - name: Create signed variety attestation
        uses: actions/attest@v4.2.2
        with:
          subject-name: ${{ matrix.subject_name }}
          subject-digest: ${{ steps.predicate.outputs.subject_digest }}
          predicate-type: https://amiasea.dev/attestation/variety/v1
          predicate-path: ${{ steps.predicate.outputs.predicate_path }}