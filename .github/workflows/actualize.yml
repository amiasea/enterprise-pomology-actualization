name: Actualize enterprise solutions

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

# Avoid overlapping actualization workflows.
concurrency:
  group: enterprise-solution-actualization
  cancel-in-progress: false

jobs:
  actualize:
    name: Actualize and retrieve topology
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Provides a stable OIDC subject for the Azure federated credential.
    # environment: institutive

    env:
      HCP_STACK_ID: ${{ vars.SOLUTION_ACTUALIZATION_STACK_ID }}
      HCP_TOKEN_SECRET_ID: ${{ vars.AMIASEA_TFE_TOKEN_VERSIONLESS_ID }}

    steps:
      - name: Authenticate to Azure using OIDC
        uses: azure/login@v3.1.0
        with:
          client-id: ${{ vars.AZURE_INSTITUTIVE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_INSTITUTIVE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_INSTITUTIVE_SUBSCRIPTION_ID }}

      - name: Retrieve HCP Terraform token from Key Vault
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:HCP_TOKEN_SECRET_ID) {
            throw "AMIASEA_TFE_TOKEN_VERSIONLESS_ID is not configured."
          }

          $token = az keyvault secret show `
            --id $env:HCP_TOKEN_SECRET_ID `
            --query value `
            --output tsv

          if ($LASTEXITCODE -ne 0 -or -not $token) {
            throw "Failed to retrieve the HCP Terraform token from Key Vault."
          }

          Write-Output "::add-mask::$token"

          "HCP_TOKEN=$token" >> $env:GITHUB_ENV

      - name: Wait for Stack deployment and retrieve outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:HCP_STACK_ID) {
            throw "SOLUTION_ACTUALIZATION_STACK_ID is not configured."
          }

          if (-not $env:HCP_TOKEN) {
            throw "Failed to retrieve the HCP Terraform token."
          }

          $api = "https://app.terraform.io/api/v2"
          $tag = $env:GITHUB_REF_NAME
          $commit = $env.GITHUB_SHA

          $headers = @{
            Authorization = "Bearer $env:HCP_TOKEN"
            Accept        = "application/vnd.api+json"
          }

          function Get-HcpResource {
            param([string]$Path)

            Invoke-RestMethod `
              -Method Get `
              -Uri "$api$Path" `
              -Headers $headers
          }

          Write-Host "Tag: $tag"
          Write-Host "Commit: $commit"

          # Allow HCP Terraform time to register the VCS tag event.
          Start-Sleep -Seconds 10

          # Find the Stack configuration created from this exact tag and commit.
          $response = Get-HcpResource `
            "/stacks/$env:HCP_STACK_ID/stack-configurations?include=ingress_attributes&page%5Bsize%5D=100"

          $configuration = $null

          foreach ($candidate in $response.data) {
            $ingressId = $candidate.relationships.'ingress-attributes'.data.id

            if (-not $ingressId) {
              continue
            }

            $ingress = $response.included |
              Where-Object { $_.id -eq $ingressId } |
              Select-Object -First 1

            if (
              $ingress.attributes.tag -eq $tag -and
              $ingress.attributes.'commit-sha' -eq $commit
            ) {
              $configuration = $candidate
              break
            }
          }

          if (-not $configuration) {
            throw "No Stack configuration exists for tag '$tag' and commit '$commit'."
          }

          Write-Host "Found Stack configuration: $($configuration.id)"

          if ($configuration.attributes.status -eq "errored") {
            throw "Stack configuration preparation failed: $($configuration.id)"
          }

          # Find the latest solutions deployment run already associated with this configuration.
          $runs = Get-HcpResource `
            "/stack-configurations/$($configuration.id)/stack-deployment-runs?page%5Bsize%5D=100"

          $deploymentRun = $runs.data |
            Where-Object { $_.attributes.deployment -eq "solutions" } |
            Select-Object -First 1

          if (-not $deploymentRun) {
            throw "No existing solutions deployment run was found for configuration '$($configuration.id)'."
          }

          $deploymentRunId = $deploymentRun.id

          Write-Host "Found solutions deployment run: $deploymentRunId"

          # Wait up to 10 minutes for this run to reach a terminal state.
          $deadline = [DateTimeOffset]::UtcNow.AddMinutes(10)

          $failureStatuses = @(
            "failed",
            "errored",
            "abandoned",
            "canceled",
            "cancelled"
          )

          while ($true) {
            if ([DateTimeOffset]::UtcNow -ge $deadline) {
              throw "Timed out after 10 minutes waiting for deployment run '$deploymentRunId'."
            }

            $runResponse = Get-HcpResource "/stack-deployment-runs/$deploymentRunId"
            $status = $runResponse.data.attributes.status

            Write-Host "Deployment run: $deploymentRunId"
            Write-Host "Status: $status"

            if ($status -eq "succeeded") {
              break
            }

            if ($status -in $failureStatuses) {
              throw "Stack deployment ended with status: $status"
            }

            Start-Sleep -Seconds 15
          }

          Write-Host "Stack deployment succeeded."

          # Retrieve the Stack's latest aggregated output summary.
          $outputPath = Join-Path $env:GITHUB_WORKSPACE "solution-variety-topologies.json"

          Invoke-WebRequest `
            -Uri "$api/stacks/$env:HCP_STACK_ID/latest-output-summary" `
            -Headers $headers `
            -OutFile $outputPath

          if (-not (Test-Path $outputPath) -or (Get-Item $outputPath).Length -eq 0) {
            throw "The Stack output summary was empty or was not created."
          }

          # Verify that the response is JSON and display it for inspection.
          $outputs = Get-Content $outputPath -Raw | ConvertFrom-Json

          Write-Host "Retrieved Stack output summary:"
          $outputs | ConvertTo-Json -Depth 100 | Write-Host

          "stack_tag=$tag" >> $env:GITHUB_OUTPUT
          "commit_sha=$commit" >> $env:GITHUB_OUTPUT
          "configuration_id=$($configuration.id)" >> $env:GITHUB_OUTPUT
          "deployment_run_id=$deploymentRunId" >> $env:GITHUB_OUTPUT

      - name: Upload Stack output summary
        uses: actions/upload-artifact@v7.0.2
        with:
          name: solution-variety-topologies
          path: solution-variety-topologies.json
          if-no-files-found: error
          retention-days: 7